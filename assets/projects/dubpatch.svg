<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 360"><title>DubPatch system overview</title><desc>Evidence-first review for a Sarvam-dubbed automotive Short. Transcripts are aligned and compared into explicit states; this is not autonomous certification.</desc><style>.b{fill:#F5F3ED;stroke:#666861}.a{stroke:#9A6136;stroke-width:2;fill:none;marker-end:url(#m)}.t{font:16px sans-serif;fill:#1A1B18}.m{font:11px monospace;fill:#666861}.s{font:12px sans-serif;fill:#666861}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9A6136"/></marker></defs><rect width="800" height="360" fill="#F5F3ED"/><text class="m" x="35" y="28">DUBPATCH / EVIDENCE-FIRST REVIEW</text><g transform="translate(35 60)"><rect class="b" width="160" height="68" rx="4"/><text class="m" x="12" y="20">INPUT</text><text class="t" x="12" y="44">source video</text><text class="s" x="12" y="60">authorised MP4</text></g><g transform="translate(35 165)"><rect class="b" width="160" height="68" rx="4"/><text class="m" x="12" y="20">INPUT</text><text class="t" x="12" y="44">source transcript</text></g><g transform="translate(235 60)"><rect class="b" width="175" height="68" rx="4"/><text class="m" x="12" y="20">ARTIFACT</text><text class="t" x="12" y="44">dubbed video</text><text class="s" x="12" y="60">uploaded target</text></g><g transform="translate(235 165)"><rect class="b" width="175" height="68" rx="4"/><text class="m" x="12" y="20">ARTIFACT</text><text class="t" x="12" y="44">dubbed transcript</text></g><path class="a" d="M195 94h40M195 199h40"/><g transform="translate(465 112)"><rect class="b" width="190" height="82" rx="4"/><text class="m" x="12" y="20">EVIDENCE</text><text class="t" x="12" y="45">alignment + checks</text><text class="s" x="12" y="64">segments • atoms • glossary</text></g><path class="a" d="M410 94 465 145M410 199 465 175"/><g transform="translate(35 280)"><rect class="b" width="155" height="48" rx="4"/><text class="t" x="12" y="30">preserved</text></g><g transform="translate(230 280)"><rect class="b" width="175" height="48" rx="4"/><text class="t" x="12" y="30">review_required</text></g><g transform="translate(445 280)"><rect class="b" width="210" height="48" rx="4"/><text class="t" x="12" y="30">unable_to_verify</text></g><path class="a" d="M560 194 112 280M560 194 318 280M560 194 550 280"/><text class="s" x="35" y="350">Optional semantic evidence cannot erase deterministic critical-atom mismatches; human review remains required.</text></svg>
