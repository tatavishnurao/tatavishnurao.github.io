<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 360"><title>SignalFlow-rs system overview</title><desc>Rust DSP/log-Mel frontend. WAV and raw samples share 16 kHz mono preprocessing and a cached LogMelProcessor before batch or streaming APIs.</desc><style>.b{fill:#F5F3ED;stroke:#666861}.a{stroke:#9A6136;stroke-width:2;fill:none;marker-end:url(#m)}.t{font:16px sans-serif;fill:#1A1B18}.m{font:11px monospace;fill:#666861}.s{font:12px sans-serif;fill:#666861}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9A6136"/></marker></defs><rect width="800" height="360" fill="#F5F3ED"/><text class="m" x="35" y="28">SIGNALFLOW-RS / DSP FRONTEND</text><g transform="translate(35 65)"><rect class="b" width="155" height="62" rx="4"/><text class="m" x="12" y="20">INPUT</text><text class="t" x="12" y="44">WAV file</text></g><g transform="translate(35 160)"><rect class="b" width="155" height="62" rx="4"/><text class="m" x="12" y="20">INPUT</text><text class="t" x="12" y="44">raw samples</text></g><g transform="translate(245 112)"><rect class="b" width="180" height="72" rx="4"/><text class="m" x="12" y="20">NORMALIZE</text><text class="t" x="12" y="46">16 kHz mono</text><text class="s" x="12" y="63">preprocess_audio</text></g><path class="a" d="M190 96h55M190 191 245 160"/><g transform="translate(480 112)"><rect class="b" width="195" height="72" rx="4"/><text class="m" x="12" y="20">SHARED KERNEL</text><text class="t" x="12" y="46">LogMelProcessor</text><text class="s" x="12" y="63">cached FFT + scratch</text></g><path class="a" d="M425 148h55"/><g transform="translate(265 255)"><rect class="b" width="180" height="62" rx="4"/><text class="m" x="12" y="20">BATCH</text><text class="t" x="12" y="44">feature matrix</text></g><g transform="translate(500 255)"><rect class="b" width="195" height="62" rx="4"/><text class="m" x="12" y="20">STREAMING</text><text class="t" x="12" y="44">buffer + drop metrics</text></g><path class="a" d="M577 184 355 255M577 184 597 255"/><text class="s" x="35" y="350">Shared DSP: frame → Hann → FFT power → Mel filterbank → log compression.</text></svg>
