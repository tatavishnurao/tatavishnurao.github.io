<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 360"><title>DubPatch critical path</title><desc>Claims connect to evidence and a verification boundary before becoming an explicit review state. Missing evidence is uncertainty, not an invented score.</desc><style>.b{fill:#F5F3ED;stroke:#666861}.a{stroke:#9A6136;stroke-width:2;fill:none;marker-end:url(#m)}.t{font:16px sans-serif;fill:#1A1B18}.m{font:11px monospace;fill:#666861}.s{font:12px sans-serif;fill:#666861}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9A6136"/></marker></defs><rect width="800" height="360" fill="#F5F3ED"/><text class="m" x="35" y="28">WHY EVIDENCE-FIRST REVIEW</text><g transform="translate(45 70)"><rect class="b" width="190" height="72" rx="4"/><text class="m" x="12" y="20">CLAIM</text><text class="t" x="12" y="46">segment meaning</text><text class="s" x="12" y="63">number • unit • entity</text></g><g transform="translate(305 70)"><rect class="b" width="190" height="72" rx="4"/><text class="m" x="12" y="20">EVIDENCE</text><text class="t" x="12" y="46">source ↔ target</text><text class="s" x="12" y="63">text + back-translation</text></g><g transform="translate(565 70)"><rect class="b" width="190" height="72" rx="4"/><text class="m" x="12" y="20">BOUNDARY</text><text class="t" x="12" y="46">confidence / gaps</text><text class="s" x="12" y="63">alignment + availability</text></g><path class="a" d="M235 106h70M495 106h70"/><path d="M45 175h710" stroke="#666861"/><text class="m" x="45" y="202">EXPLICIT DECISION STATE</text><g transform="translate(45 220)"><rect class="b" width="190" height="60" rx="4"/><text class="t" x="12" y="36">preserved</text></g><g transform="translate(305 220)"><rect class="b" width="190" height="60" rx="4"/><text class="t" x="12" y="36">review_required</text></g><g transform="translate(565 220)"><rect class="b" width="190" height="60" rx="4"/><text class="t" x="12" y="36">unable_to_verify</text></g><path class="a" d="M400 142v45M400 187 140 220M400 187v33M400 187 660 220"/><text class="t" x="45" y="320">No universal “dub accuracy score”</text><text class="s" x="45" y="342">Reports retain segment evidence, provenance, uncertainty, and action.</text></svg>
