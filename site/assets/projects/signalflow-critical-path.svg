<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 360"><title>SignalFlow-rs streaming critical path</title><desc>Incoming chunks enter a bounded buffer, are consumed by a cached LogMelProcessor, and produce feature frames plus observable drop metrics.</desc><style>.b{fill:#F5F3ED;stroke:#666861}.a{stroke:#9A6136;stroke-width:2;fill:none;marker-end:url(#m)}.t{font:16px sans-serif;fill:#1A1B18}.m{font:11px monospace;fill:#666861}.s{font:12px sans-serif;fill:#666861}</style><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9A6136"/></marker></defs><rect width="800" height="360" fill="#F5F3ED"/><text class="m" x="35" y="28">STREAMING PATH / CAPACITY IS VISIBLE</text><g transform="translate(45 80)"><rect class="b" width="175" height="72" rx="4"/><text class="m" x="12" y="20">INGRESS</text><text class="t" x="12" y="46">incoming chunks</text><text class="s" x="12" y="63">raw samples</text></g><g transform="translate(310 80)"><rect class="b" width="175" height="72" rx="4"/><text class="m" x="12" y="20">BUFFER</text><text class="t" x="12" y="46">bounded pending</text><text class="s" x="12" y="63">backpressure</text></g><g transform="translate(575 80)"><rect class="b" width="180" height="72" rx="4"/><text class="m" x="12" y="20">PROCESSOR</text><text class="t" x="12" y="46">LogMelProcessor</text><text class="s" x="12" y="63">cached FFT + filterbank</text></g><path class="a" d="M220 116h90M485 116h90"/><g transform="translate(190 230)"><rect class="b" width="180" height="62" rx="4"/><text class="m" x="12" y="20">EMIT</text><text class="t" x="12" y="44">feature frames</text></g><g transform="translate(455 230)"><rect class="b" width="210" height="62" rx="4"/><text class="m" x="12" y="20">METRICS</text><text class="t" x="12" y="44">dropped samples/frames</text></g><path class="a" d="M665 152 280 230M665 152 560 230"/><text class="t" x="45" y="330">Reusable cached wrappers are interfaces, not speed guarantees.</text><text class="s" x="45" y="350">Microphone capture and real-time scheduling are out of scope.</text></svg>
